board:
  name: "Arduino UNO Q"
  serial_port: "/dev/ttyACM0"
  baudrate: 115200
  rpmsg_endpoint: "/dev/rpmsg0"
  timeout_seconds: 0.002

display:
  native_width: 320
  native_height: 224
  scale_factor: 4
  vsync: true

haptics:
  enabled: true
  default_intensity: 220
  duration_ms: 150

peripherals:
  oled_enabled: true
  neopixel_enabled: true
  aggression_dial_enabled: true
